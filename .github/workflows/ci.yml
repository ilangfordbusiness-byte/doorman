# CI for every PR and for main: the same checks CLAUDE.md asks for before a PR.
#   app  — npm run lint, typecheck, build
#   db   — boots the local Supabase stack in Docker and runs the three SQL
#          suites exactly like `./dev.sh test` (fresh DB, all migrations applied).
#   migrate — on pushes to main only, after app and db pass: applies new
#          migrations to production with `supabase db push`. This replaces the
#          Supabase GitHub integration's "Deploy to production", which always
#          failed: it lowercases the [functions.*] keys in config.toml and then
#          cannot find supabase/functions/sendneweventsdigest on Linux.
#          Edge functions are still deployed by hand.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be in the middle of `db push`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # main currently has ~400 pre-existing checkJs errors (shadcn primitives
      # inferred as {} props). Reported, not blocking, until that is paid down.
      - run: npm run typecheck
        continue-on-error: true
      - run: npm run build

  db:
    name: SQL suites (rls, dashboard, storage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # A fresh `supabase start` applies every migration to an empty database,
      # which is what dev.sh's `db reset` gives you locally. Services the SQL
      # suites never touch are skipped to keep the boot short.
      - name: Start Supabase stack
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Run SQL suites
        run: |
          set -euo pipefail
          for t in rls_test dashboard_test storage_test; do
            echo "::group::$t"
            docker exec -i supabase_db_doorman psql -U postgres -d postgres \
              -v ON_ERROR_STOP=1 <"supabase/tests/$t.sql"
            echo "::endgroup::"
            echo "$t passed"
          done
      - name: Stop Supabase stack
        if: always()
        run: supabase stop --no-backup || true

  migrate:
    name: apply migrations to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [app, db]
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-migrate-production
      cancel-in-progress: false
    env:
      SUPABASE_PROJECT_REF: egxopdlzcxapfpjwfyki
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Set the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply new migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes
